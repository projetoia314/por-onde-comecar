name: Atualizar Manchetes e Capa

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch latest headlines
        run: python3 scripts/atualizar_noticias.py

      - name: Commit updated data/noticias.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/noticias.json
          git diff --staged --quiet || git commit -m "chore: atualiza manchetes e capa da semana"
          git push
