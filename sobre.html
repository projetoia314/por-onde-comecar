    function renderSearchResults(q) {
      const term = q.toLowerCase();
      const hits = [];
      DATA.dicionario.forEach(d => {
        if ((d.termo + ' ' + d.resumo + ' ' + d.area + ' ' + d.pontos.join(' ')).toLowerCase().includes(term)) {
          hits.push({ badge: `${d.num} • ${d.area}`, title: d.termo, desc: d.resumo, view: 'formacao' });
        }
      });
      DATA.biblioteca.forEach(b => {
        if ((b.titulo + b.autor + b.desc).toLowerCase().includes(term)) {
          hits.push({ badge: 'Biblioteca', title: `${b.titulo} — ${b.autor}`, desc: b.desc, view: 'formacao' });
        }
      });
      DATA.coletivos.forEach(c => {
        if ((c.nome + c.foco + c.tipo).toLowerCase().includes(term)) {
          hits.push({ badge: c.tipo, title: c.nome, desc: c.foco, view: 'organizacao' });
        }
      });
      DATA.midia.forEach(m => {
        if ((m.nome + m.desc + m.plataforma).toLowerCase().includes(term)) {
          hits.push({ badge: m.plataforma, title: m.nome, desc: m.desc, view: 'midia' });
        }
      });
      DATA.politicos.slice(0, 594).forEach(p => {
        if ((p.nome + ' ' + p.partido + ' ' + p.uf + ' ' + p.casa).toLowerCase().includes(term) && hits.length < 30) {
          hits.push({ badge: `${p.casa} • ${p.uf}`, title: `${p.nome} (${p.partido}-${p.uf})`, desc: `E-mail: ${p.email} | Tel: ${p.telefone}`, view: 'cobre' });
        }
      });

      return `
        <section class="space-y-4">
          <div class="flex items-center justify-between">
            <h1 class="text-2xl font-bold">Resultados para "${q}" (${hits.length})</h1>
            <button id="clearSearchBtn" class="text-sm text-red-700 dark:text-red-400 underline">Limpar busca</button>
          </div>
          ${hits.length === 0 ? `<p class="text-stone-700 dark:text-stone-300">Nenhum item encontrado. Tente outro termo como "CLT", "Soberana" ou "Manifesto".</p>` : `
            <div class="grid gap-4 sm:grid-cols-2">
              ${hits.map((h, i) => `
                <article class="p-4 rounded-xl bg-white dark:bg-stone-900 border border-stone-200 dark:border-stone-800 flex flex-col justify-between gap-3">
                  <div>
                    <span class="text-xs font-medium px-2 py-0.5 rounded bg-stone-100 dark:bg-stone-800">${h.badge}</span>
                    <h2 class="font-semibold text-base mt-2">${h.title}</h2>
                    <p class="text-sm text-stone-700 dark:text-stone-300 mt-1">${h.desc}</p>
                  </div>
                  <button data-jump="${h.view}" class="jump-btn self-start text-sm font-medium text-red-700 dark:text-red-400 hover:underline">Abrir seção &rarr;</button>
                </article>
              `).join('')}
            </div>
          `}
        </section>
      `;
    }

    function render() {
      if (state.search.trim().length > 0) {
        appMain.innerHTML = renderSearchResults(state.search.trim());
      } else if (state.view === 'inicio') {
        appMain.innerHTML = renderInicio();
      } else if (state.view === 'formacao') {
        appMain.innerHTML = renderFormacao();
      } else if (state.view === 'direitos') {
        appMain.innerHTML = renderDireitos();
      } else if (state.view === 'organizacao') {
        appMain.innerHTML = renderOrganizacao();
      } else if (state.view === 'midia') {
        appMain.innerHTML = renderMidia();
      } else if (state.view === 'cobre') {
        appMain.innerHTML = renderCobre();
      } else if (state.view === 'economia') {
        appMain.innerHTML = renderEconomia();
      } else if (state.view === 'quizzes') {
        appMain.innerHTML = renderQuizzes();
      } else if (state.view === 'apoio') {
        appMain.innerHTML = renderApoio();
      } else if (state.view === 'sobre') {
        appMain.innerHTML = renderSobre();
      } else if (state.view === 'frente') {
        appMain.innerHTML = renderFrente();
      }
      bindDynamicEvents();
    }

    function bindDynamicEvents() {
      document.querySelectorAll('.jump-btn').forEach(btn => {
        btn.addEventListener('click', () => setView(btn.dataset.jump));
      });
      const clearBtn = document.getElementById('clearSearchBtn');
      if (clearBtn) {
        clearBtn.addEventListener('click', () => {
          state.search = '';
          globalSearch.value = '';
          render();
        });
      }
      document.querySelectorAll('.ftab-btn').forEach(btn => {
        btn.addEventListener('click', () => { state.formacaoTab = btn.dataset.ftab; render(); });
      });
      document.querySelectorAll('.dcat-btn').forEach(btn => {
        btn.addEventListener('click', () => { state.dicCat = btn.dataset.dcat; render(); });
      });
      document.querySelectorAll('.dperc-btn').forEach(btn => {
        btn.addEventListener('click', () => { state.dicPercurso = btn.dataset.dperc; render(); });
      });
      document.querySelectorAll('.dic-open-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const item = DATA.dicionario.find(d => d.id === btn.dataset.dicId);
          if (item) openDicModal(item, 'explicacao');
        });
      });
      document.querySelectorAll('.rcat-btn').forEach(btn => {
        btn.addEventListener('click', () => { state.direitoCat = btn.dataset.rcat; render(); });
      });
      
      document.querySelectorAll('.story-dot-btn').forEach(btn => {
        btn.addEventListener('click', () => { state.storyIdx = parseInt(btn.dataset.storySet, 10); render(); });
      });
      const storyPrevZone = document.getElementById('storyPrevZone');
      const storyPrevBtn = document.getElementById('storyPrevBtn');
      const goStoryPrev = () => { state.storyIdx = (state.storyIdx - 1 + STORIES_DATA.length) % STORIES_DATA.length; render(); };
      if (storyPrevZone) storyPrevZone.addEventListener('click', goStoryPrev);
      if (storyPrevBtn) storyPrevBtn.addEventListener('click', goStoryPrev);

      const storyNextZone = document.getElementById('storyNextZone');
      const storyNextBtn = document.getElementById('storyNextBtn');
      const goStoryNext = () => { state.storyIdx = (state.storyIdx + 1) % STORIES_DATA.length; render(); };
      if (storyNextZone) storyNextZone.addEventListener('click', goStoryNext);
      if (storyNextBtn) storyNextBtn.addEventListener('click', goStoryNext);

      document.querySelectorAll('.ocupmov-btn').forEach(btn => {
        btn.addEventListener('click', () => { state.ocupMov = btn.dataset.ocupmov; render(); });
      });
      document.querySelectorAll('.ocupuf-btn').forEach(btn => {
        btn.addEventListener('click', () => { state.ocupUf = btn.dataset.ocupuf; render(); });
      });

      document.querySelectorAll('.otipo-btn').forEach(btn => {
        btn.addEventListener('click', () => { state.orgTipo = btn.dataset.otipo; render(); });
      });
      document.querySelectorAll('.oreg-btn').forEach(btn => {
        btn.addEventListener('click', () => { state.orgRegiao = btn.dataset.oreg; render(); });
      });
      document.querySelectorAll('.mcat-btn').forEach(btn => {
        btn.addEventListener('click', () => { state.midiaCat = btn.dataset.mcat; render(); });
      });
      document.querySelectorAll('.ccat-btn').forEach(btn => {
        btn.addEventListener('click', () => { state.canalCat = btn.dataset.ccat; render(); });
      });
      document.querySelectorAll('.plat-btn').forEach(btn => {
        btn.addEventListener('click', () => { state.midiaPlat = btn.dataset.plat; render(); });
      });
      const polBuscaInput = document.getElementById('polBuscaInput');
      if (polBuscaInput) {
        polBuscaInput.addEventListener('input', (e) => {
          state.polBusca = e.target.value;
          state.polLimit = 36;
          render();
          const el = document.getElementById('polBuscaInput');
          if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
        });
      }
      const polUfSelect = document.getElementById('polUfSelect');
      if (polUfSelect) {
        polUfSelect.addEventListener('change', (e) => { state.polUf = e.target.value; state.polLimit = 36; render(); });
      }
      const polCasaSelect = document.getElementById('polCasaSelect');
      if (polCasaSelect) {
        polCasaSelect.addEventListener('change', (e) => { state.polCasa = e.target.value; state.polLimit = 36; render(); });
      }
      const polPartidoSelect = document.getElementById('polPartidoSelect');
      if (polPartidoSelect) {
        polPartidoSelect.addEventListener('change', (e) => { state.polPartido = e.target.value; state.polLimit = 36; render(); });
      }
      document.querySelectorAll('.pmod-btn').forEach(btn => {
        btn.addEventListener('click', () => { state.polModelo = btn.dataset.pmod; render(); });
      });
      document.querySelectorAll('.copy-email-btn').forEach(btn => {
        btn.addEventListener('click', () => fallbackCopy(btn.dataset.copyEmail, 'E-mail copiado!'));
      });
      document.querySelectorAll('.copy-msg-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const pol = DATA.politicos.find(p => p.id === btn.dataset.copyMsg);
          if (pol) {
            const mod = MODELOS_COBRANCA[state.polModelo] || MODELOS_COBRANCA.escala6x1;
            const corpo = state.polTextoCustom.trim() ? state.polTextoCustom : mod.corpo(pol);
            fallbackCopy(`Assunto: ${mod.assunto(pol)}\n\n${corpo}`, 'Mensagem de cobrança copiada!');
          }
        });

          render();

      const quizNextBtn = document.getElementById('quizNextBtn');

      document.querySelectorAll('.afrente-btn').forEach(btn => {

            document.querySelectorAll('.copy-capa-btn').forEach(btn => {

        btn.addEventListener('click', () => fallbackCopy(btn.dataset.copyPix, 'Chave Pix copiada! Confira o beneficiário no app.'));

      const copySitePixBtn = document.getElementById('copySitePixBtn');
      if (copySitePixBtn) {
        copySitePixBtn.addEventListener('click', () => {

      const openSugestaoInfoBtn = document.getElementById('openSugestaoInfoBtn');
      if (openSugestaoInfoBtn) {

      document.querySelectorAll('.frente-open-btn').forEach(btn => {

        quizRestartBtn.addEventListener('click', () => {
          state.quizIdx = 0;
          state.quizScore = 0;
          state.quizStreak = 0;
          state.quizAnswered = null;
          state.quizDone = false;
          render();
        });
      }
      document.querySelectorAll('.modal-trigger').forEach(btn => {
        btn.addEventListener('click', () => {
          openModal(
            'Passo 1 da Trilha',
            'Vídeo Introdutório: Canal História Pública',
            'No site publicado no GitHub Pages, este card incorpora o vídeo do YouTube com carregamento sob demanda (lazy-load), evitando que o celular do visitante consuma dados antes de clicar.',
            'Arquivo para editar: data/trilha.json no repositório do GitHub.'
          );
        });
      });
      document.querySelectorAll('.col-detail-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const item = DATA.coletivos.find(c => c.id === btn.dataset.col);
          if (item) {
            openModal(item.tipo, item.nome, item.foco, 'Adicione o link oficial de convite ou formulário de entrada no arquivo data/coletivos.json.');
          }

    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => setView(btn.dataset.view));
    });
    document.getElementById('brandBtn').addEventListener('click', () => setView('inicio'));
    globalSearch.addEventListener('input', (e) => {
      state.search = e.target.value;
      render();
    });

    
    let fontScaleStep = 0;
    function cycleFontSize() {
      fontScaleStep = (fontScaleStep + 1) % 3;
      document.documentElement.classList.remove('font-lg', 'font-xl');
      const labels = ['A', 'A+', 'A++'];
      if (fontScaleStep === 1) document.documentElement.classList.add('font-lg');
      if (fontScaleStep === 2) document.documentElement.classList.add('font-xl');
      const fl = document.getElementById('fontLabel');
      const flm = document.getElementById('fontToggleMobile');
      if (fl) fl.textContent = labels[fontScaleStep];
      if (flm) flm.textContent = labels[fontScaleStep];
    }
    const fontToggle = document.getElementById('fontToggle');
    const fontToggleMobile = document.getElementById('fontToggleMobile');
    if (fontToggle) fontToggle.addEventListener('click', cycleFontSize);
    if (fontToggleMobile) fontToggleMobile.addEventListener('click', cycleFontSize);

    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      document.getElementById('themeIcon').textContent = isDark ? 'Claro' : 'Escuro';
    }
    document.getElementById('themeToggle').addEventListener('click', toggleTheme);
    document.getElementById('themeToggleMobile').addEventListener('click', toggleTheme);
    document.getElementById('mobileMenuBtn').addEventListener('click', () => {
      const nav = document.getElementById('mainNav');
      const expanded = nav.classList.toggle('hidden');
      document.getElementById('mobileMenuBtn').setAttribute('aria-expanded', String(!expanded));
    });



    function fallbackCopy(text, msg = 'Chave Pix copiada!') {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast(msg);
    }

    document.getElementById('closeModalBtn').addEventListener('click', () => detailModal.classList.add('hidden'));
    detailModal.addEventListener('click', (e) => {
      if (e.target === detailModal) detailModal.classList.add('hidden');
    });

    function parseCSV(text) {
      const rows = [];
      let row = [], col = '', inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const ch = text[i], next = text[i + 1];
        if (ch === '"' && inQuotes && next === '"') { col += '"'; i++; }
        else if (ch === '"') { inQuotes = !inQuotes; }
        else if (ch === ',' && !inQuotes) { row.push(col.trim()); col = ''; }
        else if ((ch === '\n' || ch === '\r') && !inQuotes) {
          if (ch === '\r' && next === '\n') i++;
          row.push(col.trim());
          if (row.some(Boolean)) rows.push(row);
          row = []; col = '';
        } else { col += ch; }
      }
      if (col.length || row.length) { row.push(col.trim()); if (row.some(Boolean)) rows.push(row); }
      return rows;
    }

    async function loadExternalData() {
      try {
        const res = await fetch('data/noticias.json', { cache: 'no-store' });
        if (res.ok) {
          const json = await res.json();
          if (json && json.manchetes) { NOTICIAS_DATA = json; if (state.view === 'midia') render(); }
        }
      } catch (e) {}

      if (SHEETS_COLETIVOS_CSV_URL) {
        try {
          const res = await fetch(SHEETS_COLETIVOS_CSV_URL, { cache: 'no-store' });
          if (res.ok) {
            const rows = parseCSV(await res.text());
            if (rows.length > 1) {
              const headers = rows[0].map(h => h.toLowerCase());
              const parsed = rows.slice(1).map((r, idx) => {
                const obj = { id: 'sheet-' + (idx + 1), nome: '', tipo: 'Movimento Social', regiao: 'Nacional', foco: '', url: '', imagem: '', frenteId: '' };
                headers.forEach((h, i) => { if (h in obj && r[i]) obj[h] = r[i]; });
                return obj;
              }).filter(o => o.nome);
              if (parsed.length) { DATA.coletivos = parsed; if (state.view === 'organizacao') render(); }
            }
          }
        } catch (e) {}
      }
    }

    render();
    loadExternalData();
  </script>
